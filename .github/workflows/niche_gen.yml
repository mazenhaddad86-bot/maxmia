name: KatanaLabs Niche Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb -qq
      - name: Decode and run generator
        env:
          HIGGSFIELD_CLIENT_TOKEN: ${{ secrets.HIGGSFIELD_CLIENT_TOKEN }}
          HIGGSFIELD_SESSION_ID: ${{ secrets.HIGGSFIELD_SESSION_ID }}
          HIGGSFIELD_COOKIES: ${{ secrets.HIGGSFIELD_COOKIES }}
          DISPLAY: ":99"
          GEN_SCRIPT_B64: 
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo $GEN_SCRIPT_B64 | base64 -d > gen_niches.py
          mkdir -p niche_output
          python3 gen_niches.py
      - name: SCP to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 138.199.203.58 >> ~/.ssh/known_hosts 2>/dev/null
          ls niche_output/ | wc -l
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no niche_output/*.png niche_output/*.mp4 root@138.199.203.58:/root/niche_output/ 2>/dev/null || echo "no files to scp"
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@138.199.203.58 bash /root/deploy_niches.sh
